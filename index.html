<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calcaris</title>
<style>
:root {color-scheme:dark}
* {box-sizing:border-box}
body {margin:0; min-height:100vh; color:#e4f0ff; font:16px system-ui,sans-serif;
 background:#081421 url('background.svg') center/cover fixed no-repeat}
main {max-width:960px; margin:9vh auto 4rem; padding:0 22px}
h1 {font:400 2rem ui-monospace,monospace; letter-spacing:.18em; color:#9cdef3; margin:0}
.subtitle {color:#9bb3c8; margin:8px 0 28px}
.logout {position:fixed; top:18px; right:24px; color:#aac4d8; text-decoration:none; font-size:.9rem}
.logout:hover {color:white}
textarea {width:100%; min-height:230px; resize:vertical; background:#0b1b2cdd; color:#e6f3ff;
 border:1px solid #54738b; border-radius:10px; padding:17px; font:1rem/1.75 ui-monospace,monospace}
textarea:focus {outline:1px solid #80d4ef}
.panel {background:#0b1b2cdd; border:1px solid #344e64; border-radius:10px; padding:16px; margin-top:16px}
.toolbar {display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap}
button {background:#17354a; color:#d9f5ff; border:1px solid #57778c; border-radius:7px; padding:8px 13px; cursor:pointer}
button:hover {background:#23516d}
.line {display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; border-top:1px solid #30465a; padding:9px 0;
 font: .95rem/1.5 ui-monospace,monospace}
.line:first-of-type {border-top:0}
.expr {color:#9bb3c8; overflow-wrap:anywhere; white-space:pre-wrap}
.result {text-align:right; color:#8ae5bd; font-weight:bold}
.error {color:#ffadab}
small {color:#9bb3c8}
</style>
</head>
<body>
<a href="/_gate/logout" class="logout">Log out</a>
<main>
<h1>CALCARIS</h1>
<p class="subtitle">Engineering calculations · one expression per line</p>
<textarea id="input" spellcheck="false" aria-label="Calculations" placeholder="12[t roll] x 10[kN/t] / 2[sides] = 60&#10;sin(30°) x 100 = 50&#10;= 400 + 1 = 401"></textarea>
<div class="panel">
<div class="toolbar"><strong>Results</strong><button id="copy" type="button">Copy updated block</button></div>
<div id="results" aria-live="polite"></div>
</div>
<p><small>Supports + − x * / ^ ( ), sin, cos, tan, sqrt, abs, pi and °. Notes in [brackets] are ignored. Old results after = are replaced when copying the complete block. Decimal commas and spaces in numbers are supported.</small></p>
</main>
<script src="calculator.js"></script>
</body>
</html>
